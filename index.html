<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VÉRTICE — Connecting the Extraordinary</title>
<link rel="stylesheet" href="_ds/v-rtice-design-system-7ea98b95-d88c-44ef-9f43-1bdbdc6ad883/styles.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          selva: "#0D2E1F", deep: "#0A2417", card: "#0F3D23",
          emerald: { DEFAULT: "#1B6B45", light: "#2A8659", dark: "#155539" },
          dorado: { DEFAULT: "#C9A84C", bright: "#D9BC68", dark: "#A8893A" },
          marfil: "#F5F2EB", gris: { DEFAULT: "#8AABA0", light: "#CCDED7", deep: "#5E7A70" },
          line: "#1B3D2A",
        },
        fontFamily: {
          display: ['"Neue Haas Grotesk Text Pro"', "system-ui", "sans-serif"],
          body: ['"Inter"', "system-ui", "sans-serif"],
        },
      },
    },
  };
</script>
<style>
  /* ── Tweakable feel variables (driven by the Tweaks panel) ── */
  :root {
    --vt-gold: #C9A84C;
    --vt-gold-bright: #D9BC68;
    --vt-gold-deep: #A8893A;
    --vt-reveal-dur: .95s;
    --vt-reveal-dist: 34px;
    --vt-reveal-blur: 16px;
    /* atmosphere overlay knobs (set per data-atmos below) */
    --vt-atmos-tint: transparent;
    --vt-atmos-blend: normal;
    --vt-atmos-vignette: rgba(4,14,9,0);
    --vt-body: #0D2E1F;
  }

  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--vt-body); color: #F5F2EB; font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; transition: background .6s ease; }
  ::selection { background: var(--vt-gold); color: #0D2E1F; }

  /* ── Atmosphere: a single fixed full-page wash + vignette over all content ── */
  #vt-atmos { position: fixed; inset: 0; pointer-events: none; z-index: 2147483000;
    background: var(--vt-atmos-tint); mix-blend-mode: var(--vt-atmos-blend);
    transition: background .6s ease; }
  #vt-atmos::after { content: ""; position: absolute; inset: 0;
    background: radial-gradient(120% 115% at 50% 32%, transparent 42%, var(--vt-atmos-vignette) 100%);
    transition: background .6s ease; }
  body[data-atmos="nocturne"] { --vt-body: #071710;
    --vt-atmos-tint: linear-gradient(180deg, #0a2016 0%, #050f0a 100%); --vt-atmos-blend: multiply;
    --vt-atmos-vignette: rgba(3,11,7,0.78); }
  body[data-atmos="daybreak"] { --vt-body: #11442d;
    --vt-atmos-tint: linear-gradient(180deg, rgba(150,182,166,0.20) 0%, rgba(110,150,132,0.13) 100%); --vt-atmos-blend: screen;
    --vt-atmos-vignette: rgba(4,14,9,0); }

  /* Scroll-reveal — entrance distance / duration / blur all tweakable */
  @keyframes vt-rise { from { opacity: 0; transform: translateY(var(--vt-reveal-dist)); } to { opacity: 1; transform: none; } }
  @keyframes vt-rise-blur { from { opacity: 0; filter: blur(var(--vt-reveal-blur)); transform: translateY(calc(var(--vt-reveal-dist) * 0.65)); } to { opacity: 1; filter: blur(0); transform: none; } }
  .reveal { opacity: 0; }
  .reveal.is-in { animation: vt-rise var(--vt-reveal-dur) cubic-bezier(.16,1,.3,1) both; }
  .reveal-blur { opacity: 0; }
  .reveal-blur.is-in { animation: vt-rise-blur calc(var(--vt-reveal-dur) * 1.2) cubic-bezier(.16,1,.3,1) both; }
  @media (prefers-reduced-motion: reduce) { .reveal, .reveal-blur { animation: none !important; opacity: 1 !important; filter: none !important; transform: none !important; } }

  /* ── Gold accent follows --vt-gold so the "Accent metal" tweak retints everything ── */
  .text-dorado { color: var(--vt-gold) !important; }
  .hover\:text-dorado:hover { color: var(--vt-gold) !important; }
  .bg-dorado { background-color: var(--vt-gold) !important; }
  .hover\:bg-dorado:hover { background-color: var(--vt-gold) !important; }
  .bg-dorado-bright, .hover\:bg-dorado-bright:hover { background-color: var(--vt-gold-bright) !important; }
  .bg-dorado\/80 { background-color: color-mix(in srgb, var(--vt-gold) 80%, transparent) !important; }
  .bg-dorado\/70 { background-color: color-mix(in srgb, var(--vt-gold) 70%, transparent) !important; }
  .border-dorado\/70 { border-color: color-mix(in srgb, var(--vt-gold) 70%, transparent) !important; }

  /* Hero wordmark scaling */
  .hero-word { font-size: clamp(64px, 14.5vw, 224px); line-height: .84; letter-spacing: .01em; }

  /* Marquee */
  .marquee { display: inline-flex; white-space: nowrap; will-change: transform; animation: marquee 38s linear infinite; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .marquee-wrap:hover .marquee { animation-play-state: paused; }

  /* image-slot empty state recolor for dark */
  image-slot::part(empty) { color: #8AABA0; }
  image-slot::part(frame) { background: #0A2417; }

  .glass { background: rgba(10,36,23,0.55); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .grain { background-image: url("assets/pattern-network.svg"); background-size: 420px; }

  /* Two-clip dissolve loop (Conferences & Summits) — the top video fades in and out
     over the base one, continuously mixing the two. */
  @keyframes vt-mix { 0%, 14% { opacity: 0; } 46%, 60% { opacity: 1; } 92%, 100% { opacity: 0; } }
  .vt-mix-top { opacity: 0; animation: vt-mix 12s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .vt-mix-top { animation: none; opacity: .5; } }

  /* ── Presence world map: pulsing city nodes ── */
  .vt-node { position: absolute; transform: translate(-50%, -50%); }
  .vt-node-core { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; border-radius: 9999px;
    background: #C9A84C; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px rgba(13,46,31,0.9), 0 0 12px rgba(201,168,76,0.7); z-index: 2; }
  .vt-ping { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; border-radius: 9999px;
    background: var(--vt-gold, #C9A84C); transform: translate(-50%, -50%); animation: vt-ping 2s ease-out infinite; z-index: 1; }
  @keyframes vt-ping { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .vt-ping { animation: none; opacity: 0; } }

  /* map entrance (fade + scale), CSS-driven via data-in */
  .vt-map { opacity: 0; transform: scale(0.95); transform-origin: center;
    transition: opacity 1.2s cubic-bezier(.22,1,.36,1), transform 1.2s cubic-bezier(.22,1,.36,1); }
  .vt-map[data-in="1"] { opacity: 1; transform: none; }

  /* dots pop in one-by-one (transition-delay set inline per node) */
  .vt-node-wrap { opacity: 0; transform: scale(0); transform-origin: center;
    transition: opacity .45s ease, transform .45s cubic-bezier(.34,1.56,.64,1); }
  .vt-node-wrap[data-in="1"] { opacity: 1; transform: scale(1); }

  /* hover card: scale .8→1, opacity 0→1, y 10→0 (x holds the edge-nudge) */
  .vt-card { opacity: 0; transform: translate(var(--vt-card-x, -50%), 10px) scale(0.8);
    transition: opacity .3s cubic-bezier(.22,1,.36,1), transform .3s cubic-bezier(.22,1,.36,1); }
  .vt-card[data-below="1"] { transform: translate(var(--vt-card-x, -50%), -10px) scale(0.8); }
  .vt-node-wrap[data-hover="1"] .vt-card { opacity: 1; transform: translate(var(--vt-card-x, -50%), 0) scale(1); }
  @media (prefers-reduced-motion: reduce) {
    .vt-map, .vt-node-wrap { opacity: 1 !important; transform: none !important; transition: none; }
  }

</style>
</head>
<body>
  <div id="root"></div>
  <div id="vt-atmos"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="image-slot.js"></script>

  <script src="https://unpkg.com/framer-motion@11.18.2/dist/framer-motion.js"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="landing/helpers.jsx"></script>
  <script type="text/babel" src="landing/worldmap.jsx"></script>
  <script type="text/babel" src="landing/sections.jsx"></script>
  <script type="text/babel" src="landing/app.jsx"></script>
  <script type="text/babel">
    ReactDOM.createRoot(document.getElementById("root")).render(<VerticeLanding />);
  </script>

</html>
